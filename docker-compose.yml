version: '3.9'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    env_file:
      - .env
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  fastapi:
    build: .
    container_name: fastapi-app
    ports:
      - "9090:9090"
    env_file:
      - .env
    depends_on:
      - qdrant
    volumes:
      - .:/app
    restart: unless-stopped
